name: Apply pilot UI hardening

on:
  push:
    branches:
      - wms-stabilization-round8

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: wms-stabilization-round8

      - name: Apply deterministic UI/metrics patch
        run: node scripts/apply-pilot-ui-hardening.mjs

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No patch required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/Receiving.tsx src/components/Shipping.tsx src/components/StockCount.tsx src/services/stockCounts.ts
          git commit -m 'feat: enforce read-only viewer UI and completed-count metrics'
          git push origin HEAD:wms-stabilization-round8
