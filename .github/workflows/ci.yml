name: WMS CI

on:
  push:
    branches:
      - main
      - wms-stabilization-round8
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee ci-typecheck.log

      - name: Production build
        if: always()
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ci-build.log

      - name: Upload web diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-diagnostics
          path: |
            ci-typecheck.log
            ci-build.log
          if-no-files-found: ignore
          retention-days: 3

  migrations-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check duplicate migration versions
        shell: bash
        run: |
          set -euo pipefail
          duplicates="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -E 's/^([0-9]+)_.*/\1/' \
            | sort \
            | uniq -d)"

          if [ -n "$duplicates" ]; then
            echo "Duplicate migration versions found:"
            echo "$duplicates"
            exit 1
          fi

      - name: Reject trigger pseudo-records inside policies
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'WITH CHECK.*(NEW\.|OLD\.)' supabase/migrations; then
            echo 'NEW/OLD cannot be used as row pseudo-records in RLS policy expressions.'
            exit 1
          fi

  migrations-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d wms_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: wms_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare minimal Supabase auth compatibility
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;

          CREATE TABLE auth.users (
            id uuid PRIMARY KEY,
            instance_id uuid,
            email text,
            encrypted_password text,
            email_confirmed_at timestamptz,
            raw_app_meta_data jsonb DEFAULT '{}'::jsonb,
            raw_user_meta_data jsonb DEFAULT '{}'::jsonb,
            created_at timestamptz DEFAULT now(),
            updated_at timestamptz DEFAULT now(),
            aud text,
            role text,
            confirmation_token text DEFAULT '',
            email_change text DEFAULT '',
            email_change_token_new text DEFAULT '',
            recovery_token text DEFAULT ''
          );

          CREATE OR REPLACE FUNCTION auth.uid()
          RETURNS uuid
          LANGUAGE sql
          STABLE
          AS $$
            SELECT NULLIF(current_setting('request.jwt.claims', true)::jsonb ->> 'sub', '')::uuid;
          $$;

          CREATE OR REPLACE FUNCTION auth.role()
          RETURNS text
          LANGUAGE sql
          STABLE
          AS $$
            SELECT COALESCE(
              current_setting('request.jwt.claims', true)::jsonb ->> 'role',
              current_user
            );
          $$;
          SQL

      - name: Apply migrations 001 through latest
        shell: bash
        run: |
          set -euo pipefail
          for migration in $(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Smoke-check critical functions
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regprocedure('public.process_receipt_atomically(uuid)') IS NULL THEN
              RAISE EXCEPTION 'process_receipt_atomically missing';
            END IF;
            IF to_regprocedure('public.reserve_stock_for_shipment(uuid)') IS NULL THEN
              RAISE EXCEPTION 'reserve_stock_for_shipment missing';
            END IF;
            IF to_regprocedure('public.process_stock_count_adjustments(uuid)') IS NULL THEN
              RAISE EXCEPTION 'process_stock_count_adjustments missing';
            END IF;
            IF to_regprocedure('public.create_receipt_with_lines(text,text,date,text,text,jsonb)') IS NULL THEN
              RAISE EXCEPTION 'create_receipt_with_lines missing';
            END IF;
            IF to_regprocedure('public.create_shipment_with_lines(text,text,text,text,date,text,jsonb)') IS NULL THEN
              RAISE EXCEPTION 'create_shipment_with_lines missing';
            END IF;
            IF to_regprocedure('public.create_and_process_movement(text,text,text,jsonb)') IS NULL THEN
              RAISE EXCEPTION 'create_and_process_movement missing';
            END IF;
            IF to_regprocedure('public.create_stock_count_with_snapshot(text,uuid,text)') IS NULL THEN
              RAISE EXCEPTION 'create_stock_count_with_snapshot missing';
            END IF;
          END $$;
          SQL

      - name: Prepare disposable authorization fixtures
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users (id, email, raw_user_meta_data, aud, role)
          VALUES
            ('10000000-0000-0000-0000-000000000001', 'admin@round8.test', '{}'::jsonb, 'authenticated', 'authenticated'),
            ('10000000-0000-0000-0000-000000000002', 'operator@round8.test', '{}'::jsonb, 'authenticated', 'authenticated'),
            ('10000000-0000-0000-0000-000000000003', 'viewer@round8.test', '{}'::jsonb, 'authenticated', 'authenticated'),
            ('10000000-0000-0000-0000-000000000004', 'disabled@round8.test', '{}'::jsonb, 'authenticated', 'authenticated');

          SELECT set_config('request.jwt.claims', '{"role":"service_role"}', false);
          UPDATE public.profiles SET role = 'admin', active = true
           WHERE id = '10000000-0000-0000-0000-000000000001';
          UPDATE public.profiles SET role = 'operator', active = true
           WHERE id = '10000000-0000-0000-0000-000000000002';
          UPDATE public.profiles SET role = 'viewer', active = true
           WHERE id = '10000000-0000-0000-0000-000000000003';
          UPDATE public.profiles SET role = 'operator', active = false
           WHERE id = '10000000-0000-0000-0000-000000000004';
          SQL

      - name: Execute core transactional regressions
        shell: bash
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/regression_tests_round8_core.sql
