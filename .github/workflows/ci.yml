name: WMS CI

on:
  push:
    branches:
      - main
      - wms-stabilization-round8
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee ci-typecheck.log

      - name: Offline regressions
        run: node scripts/test-offline.mjs

      - name: Scalability regressions
        run: node scripts/test-round10.mjs

      - name: Catalog import regressions
        run: node scripts/test-round11.mjs

      - name: Production build
        if: always()
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ci-build.log

      - name: Upload web diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-diagnostics
          path: |
            ci-typecheck.log
            ci-build.log
          if-no-files-found: ignore
          retention-days: 7

  migrations-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check duplicate migration versions
        shell: bash
        run: |
          set -euo pipefail
          duplicates="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -E 's/^([0-9]+)_.*/\1/' \
            | sort \
            | uniq -d)"

          if [ -n "$duplicates" ]; then
            echo "Duplicate migration versions found:"
            echo "$duplicates"
            exit 1
          fi

      - name: Reject trigger pseudo-records inside policies
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'WITH CHECK.*(NEW\.|OLD\.)' supabase/migrations; then
            echo 'NEW/OLD cannot be used as row pseudo-records in RLS policy expressions.'
            exit 1
          fi

  migrations-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d wms_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: wms_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare minimal Supabase auth compatibility
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;

          CREATE TABLE auth.users (
            id uuid PRIMARY KEY,
            instance_id uuid,
            email text,
            encrypted_password text,
            email_confirmed_at timestamptz,
            raw_app_meta_data jsonb DEFAULT '{}'::jsonb,
            raw_user_meta_data jsonb DEFAULT '{}'::jsonb,
            created_at timestamptz DEFAULT now(),
            updated_at timestamptz DEFAULT now(),
            aud text,
            role text,
            confirmation_token text DEFAULT '',
            email_change text DEFAULT '',
            email_change_token_new text DEFAULT '',
            recovery_token text DEFAULT ''
          );

          CREATE OR REPLACE FUNCTION auth.uid()
          RETURNS uuid
          LANGUAGE sql
          STABLE
          AS $$
            SELECT NULLIF(current_setting('request.jwt.claims', true)::jsonb ->> 'sub', '')::uuid;
          $$;

          CREATE OR REPLACE FUNCTION auth.role()
          RETURNS text
          LANGUAGE sql
          STABLE
          AS $$
            SELECT COALESCE(
              current_setting('request.jwt.claims', true)::jsonb ->> 'role',
              current_user
            );
          $$;
          SQL

      - name: Apply migrations 001 through latest
        shell: bash
        run: |
          set -euo pipefail
          for migration in $(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Smoke-check critical functions
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regprocedure('public.process_receipt_atomically(uuid)') IS NULL THEN
              RAISE EXCEPTION 'process_receipt_atomically missing';
            END IF;
            IF to_regprocedure('public.reserve_stock_for_shipment(uuid)') IS NULL THEN
              RAISE EXCEPTION 'reserve_stock_for_shipment missing';
            END IF;
            IF to_regprocedure('public.release_shipment_reservations(uuid)') IS NULL THEN
              RAISE EXCEPTION 'release_shipment_reservations missing';
            END IF;
            IF to_regprocedure('public.confirm_shipment_picked(uuid)') IS NULL THEN
              RAISE EXCEPTION 'confirm_shipment_picked missing';
            END IF;
            IF to_regprocedure('public.process_stock_count_adjustments(uuid)') IS NULL THEN
              RAISE EXCEPTION 'process_stock_count_adjustments missing';
            END IF;
            IF to_regprocedure('public.create_receipt_with_lines(text,text,date,text,text,jsonb)') IS NULL THEN
              RAISE EXCEPTION 'create_receipt_with_lines missing';
            END IF;
            IF to_regprocedure('public.create_shipment_with_lines(text,text,text,text,date,text,jsonb)') IS NULL THEN
              RAISE EXCEPTION 'create_shipment_with_lines missing';
            END IF;
            IF to_regprocedure('public.create_and_process_movement(text,text,text,jsonb)') IS NULL THEN
              RAISE EXCEPTION 'create_and_process_movement missing';
            END IF;
            IF to_regprocedure('public.create_stock_count_with_snapshot(text,uuid,text)') IS NULL THEN
              RAISE EXCEPTION 'create_stock_count_with_snapshot missing';
            END IF;
            IF to_regprocedure('public.register_product_with_barcode(text,text,text,text,text,numeric,numeric,text,text,text,numeric,uuid,numeric)') IS NULL THEN
              RAISE EXCEPTION 'register_product_with_barcode missing';
            END IF;
            IF to_regprocedure('public.search_stock_locations(text,integer)') IS NULL THEN
              RAISE EXCEPTION 'search_stock_locations missing';
            END IF;
            IF to_regprocedure('public.get_inventory_accuracy(uuid)') IS NULL THEN
              RAISE EXCEPTION 'get_inventory_accuracy missing';
            END IF;
            IF to_regprocedure('public.get_dashboard_stats()') IS NULL THEN
              RAISE EXCEPTION 'get_dashboard_stats missing';
            END IF;
            IF to_regprocedure('public.search_products_with_stock(text,integer,integer)') IS NULL THEN
              RAISE EXCEPTION 'search_products_with_stock missing';
            END IF;
            IF to_regprocedure('public.search_locations(text,integer,boolean)') IS NULL THEN
              RAISE EXCEPTION 'search_locations missing';
            END IF;
            IF to_regprocedure('public.search_product_source_locations(uuid,text,integer)') IS NULL THEN
              RAISE EXCEPTION 'search_product_source_locations missing';
            END IF;
            IF to_regprocedure('public.search_locations_with_occupancy(text,text,integer,integer)') IS NULL THEN
              RAISE EXCEPTION 'search_locations_with_occupancy missing';
            END IF;
            IF to_regprocedure('public.get_location_map_stats()') IS NULL THEN
              RAISE EXCEPTION 'get_location_map_stats missing';
            END IF;
            IF to_regprocedure('public.search_stock_count_lines(uuid,text,integer,integer)') IS NULL THEN
              RAISE EXCEPTION 'search_stock_count_lines missing';
            END IF;
            IF to_regprocedure('public.get_stock_count_progress(uuid)') IS NULL THEN
              RAISE EXCEPTION 'get_stock_count_progress missing';
            END IF;
          END $$;
          SQL

      - name: Prepare disposable authorization fixtures
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO auth.users (id, email, raw_user_meta_data, aud, role)
          VALUES
            ('10000000-0000-0000-0000-000000000001', 'admin@round8.test', '{}'::jsonb, 'authenticated', 'authenticated'),
            ('10000000-0000-0000-0000-000000000002', 'operator@round8.test', '{}'::jsonb, 'authenticated', 'authenticated'),
            ('10000000-0000-0000-0000-000000000003', 'viewer@round8.test', '{}'::jsonb, 'authenticated', 'authenticated'),
            ('10000000-0000-0000-0000-000000000004', 'disabled@round8.test', '{}'::jsonb, 'authenticated', 'authenticated'),
            ('10000000-0000-0000-0000-000000000005', 'manager@round8.test', '{}'::jsonb, 'authenticated', 'authenticated');

          SELECT set_config('request.jwt.claims', '{"role":"service_role"}', false);
          UPDATE public.profiles SET role = 'admin', active = true
           WHERE id = '10000000-0000-0000-0000-000000000001';
          UPDATE public.profiles SET role = 'operator', active = true
           WHERE id = '10000000-0000-0000-0000-000000000002';
          UPDATE public.profiles SET role = 'viewer', active = true
           WHERE id = '10000000-0000-0000-0000-000000000003';
          UPDATE public.profiles SET role = 'operator', active = false
           WHERE id = '10000000-0000-0000-0000-000000000004';
          UPDATE public.profiles SET role = 'manager', active = true
           WHERE id = '10000000-0000-0000-0000-000000000005';
          SQL

      - name: Execute core transactional regressions
        shell: bash
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/regression_tests_round8_core.sql

      - name: Execute shipping regressions
        shell: bash
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/regression_tests_round8_shipping.sql

      - name: Execute concurrent reservation regression
        shell: bash
        run: bash supabase/tests/concurrency_reservation_round8.sh

      - name: Execute concurrent physical movement regression
        shell: bash
        run: bash supabase/tests/concurrency_movement_round8.sh

      - name: Execute stock and count regressions
        shell: bash
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/regression_tests_round8_stock_count.sql

      - name: Execute paginated stock count regression
        shell: bash
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/stock_count_pagination_round8.sql

      - name: Execute unavailable location regressions
        shell: bash
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/location_availability_round8.sql

      - name: Execute barcode registration regressions
        shell: bash
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/barcode_registration_round8.sql

      - name: Execute product lifecycle regressions
        shell: bash
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/product_lifecycle_round8.sql

      - name: Execute 3000 SKU locator load regression
        shell: bash
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/load_search_3000_skus_round8.sql

      - name: Prepare authenticated grants for RLS simulation
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE ON SCHEMA public, auth TO authenticated;
          GRANT SELECT ON ALL TABLES IN SCHEMA public TO authenticated;
          GRANT INSERT, UPDATE, DELETE ON
            public.products,
            public.product_barcodes,
            public.locations,
            public.movements,
            public.movement_lines,
            public.receipts,
            public.receipt_lines,
            public.shipments,
            public.shipment_lines,
            public.stock_counts,
            public.stock_count_lines
          TO authenticated;
          GRANT UPDATE ON public.profiles TO authenticated;
          SQL

      - name: Execute authenticated RLS regressions
        shell: bash
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rls_tests_round8.sql

      - name: Execute Round 11 atomic catalog import regressions
        shell: bash
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/catalog_import_round11.sql

      - name: Test backup and local restoration
        shell: bash
        run: |
          set -euo pipefail
          # Use the same PostgreSQL image as the service, independent of runner packages.
          export PGHOST=127.0.0.1
          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT
          export WMS_CI_BACKUP_ROOT="$root"
          mkdir "$root/bin"
          cat > "$root/bin/pg-client" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          tool="$(basename "$0")"
          exec docker run --rm -i --pull never --network host \
            --user "$(id -u):$(id -g)" \
            -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE -e PGPASSWORD \
            -v "$WMS_CI_BACKUP_ROOT:$WMS_CI_BACKUP_ROOT" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            -w "$GITHUB_WORKSPACE" --entrypoint "$tool" postgres:15 "$@"
          SH
          chmod +x "$root/bin/pg-client"
          for tool in psql pg_dump pg_restore createdb; do
            ln -s pg-client "$root/bin/$tool"
          done
          export PATH="$root/bin:$PATH"
          pg_dump --version
          pg_restore --version
          psql -X -At -v ON_ERROR_STOP=1 -f supabase/diagnostics/row_counts.sql > "$root/counts-before.txt"
          node scripts/wms-backup.mjs backup "$root"
          backup="$(find "$root" -maxdepth 1 -type d -name 'wms-*' -print -quit)"
          test -n "$backup"
          node scripts/wms-backup.mjs verify "$backup"
          cp -a "$backup" "$root/corrupt"
          printf 'x' >> "$root/corrupt/wms.dump"
          if node scripts/wms-backup.mjs verify "$root/corrupt"; then
            echo "Corrupted backup was accepted"; exit 1
          fi
          if node scripts/wms-backup.mjs restore-local "$backup" --confirm-disposable; then
            echo "Non-disposable target accepted"; exit 1
          fi
          createdb -T template0 wms_restore_ci
          export PGDATABASE=wms_restore_ci
          if node scripts/wms-backup.mjs restore-local "$backup"; then
            echo "Restore without confirmation accepted"; exit 1
          fi
          node scripts/wms-backup.mjs restore-local "$backup" --confirm-disposable
          psql -X -At -v ON_ERROR_STOP=1 -f supabase/diagnostics/row_counts.sql > "$root/counts-after.txt"
          diff -u "$root/counts-before.txt" "$root/counts-after.txt"
          psql -X -v ON_ERROR_STOP=1 -f supabase/diagnostics/integrity_report.sql > /dev/null
          if node scripts/wms-backup.mjs restore-local "$backup" --confirm-disposable; then
            echo "Non-empty restore accepted"; exit 1
          fi
          echo "Round 11 backup restore, row counts and safety guards passed."
