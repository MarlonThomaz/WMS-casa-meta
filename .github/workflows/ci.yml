name: WMS CI

on:
  push:
    branches:
      - main
      - wms-stabilization-round8
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee ci-typecheck.log

      - name: Production build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ci-build.log

      - name: Upload web diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-diagnostics
          path: |
            ci-typecheck.log
            ci-build.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Enforce web checks
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.typecheck.outcome }}" != "success" ] || [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "TypeScript outcome: ${{ steps.typecheck.outcome }}"
            echo "Build outcome: ${{ steps.build.outcome }}"
            exit 1
          fi

  migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check duplicate migration versions
        shell: bash
        run: |
          set -euo pipefail
          duplicates="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -E 's/^([0-9]+)_.*/\1/' \
            | sort \
            | uniq -d)"

          if [ -n "$duplicates" ]; then
            echo "Duplicate migration versions found:"
            echo "$duplicates"
            exit 1
          fi

      - name: Reject trigger pseudo-records inside policies
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'WITH CHECK.*(NEW\.|OLD\.)' supabase/migrations; then
            echo 'NEW/OLD cannot be used as row pseudo-records in RLS policy expressions.'
            exit 1
          fi
